<div class="app" id="app">
  <nav class="side" id="side" aria-label="Разделы"></nav>

  <main class="main" id="content">
    <header class="bar">
      <div class="src-tabs" role="tablist" aria-label="Источник">
        <button type="button" role="tab" id="tabYt" aria-selected="true">YouTube</button>
        <button type="button" role="tab" id="tabVk" aria-selected="false">VK Видео</button>
      </div>
      <form id="searchForm" class="search" role="search">
        <svg class="ico"><use href="#i-search"/></svg>
        <label class="sr" for="q">Поиск</label>
        <input id="q" type="search" placeholder="Поиск на YouTube или ссылка" autocomplete="off" maxlength="300">
        <button class="go" type="submit">Найти</button>
      </form>
      <div class="seg" id="qualitySeg" role="radiogroup" aria-label="Качество">
        <button type="button" role="radio" data-q="best" aria-checked="true">Лучшее</button>
        <button type="button" role="radio" data-q="1080" aria-checked="false">1080p</button>
        <button type="button" role="radio" data-q="720" aria-checked="false">720p</button>
      </div>
      <button class="chip-btn" id="routeChip" type="button" title="Сеть: прокси и VPN"><span class="dot" id="routeDot"></span><svg class="ico"><use href="#i-globe"/></svg><span id="routeText">Напрямую</span></button>
    </header>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div id="view"></div>
  </main>

  <aside class="stage" id="stage" aria-label="Помощница">
    <div class="globe"></div>
    <div class="sparks" aria-hidden="true"></div>
    <img class="hero" id="hero" src="assets/heroines/rei.webp" alt="">
    <div class="mood" id="mood" aria-hidden="true"></div>
    <div class="switcher" id="switcher" role="radiogroup" aria-label="Выбор помощницы"></div>
    <div class="stage-foot">
      <div class="who"><b id="stName">Рэй</b><span id="stPersona"></span></div>
      <div class="acts" id="acts"></div>
    </div>
  </aside>
</div>

<section class="chat closed" id="chat" aria-label="Чат с помощницей">
  <header class="chat-head">
    <img id="chatAv" class="av" src="assets/heroines/rei.webp" alt="">
    <div class="ch-who"><b id="chName">Рэй</b><span>ИИ — второй этап</span></div>
    <button class="icon-btn sm" id="chatClose" type="button" aria-label="Свернуть чат"><svg class="ico"><use href="#i-close"/></svg></button>
  </header>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <form class="composer" id="chatForm">
    <button class="icon-btn" type="button" disabled aria-label="Микрофон (второй этап)" title="Микрофон — второй этап"><svg class="ico"><use href="#i-mic"/></svg></button>
    <label class="sr" for="chatIn">Сообщение</label>
    <input id="chatIn" type="text" placeholder="Написать помощнице…" autocomplete="off" maxlength="200">
    <button class="go sq" type="submit" aria-label="Отправить"><svg class="ico"><use href="#i-send"/></svg></button>
  </form>
</section>
<button class="chat-fab" id="chatFab" type="button" aria-label="Открыть чат с помощницей"><img id="fabAv" src="assets/heroines/rei.webp" alt=""></button>

<div class="menu" id="menu" role="menu" hidden></div>
<dialog id="plDialog" aria-labelledby="plTitle">
  <form method="dialog" id="plForm">
    <h2 id="plTitle">Добавить в плейлист</h2>
    <div id="plList" class="pl-list"></div>
    <div class="field"><label class="sr" for="plNew">Новый плейлист</label><input id="plNew" type="text" placeholder="Новый плейлист" maxlength="80"><button class="go" type="submit">Создать</button></div>
    <div class="actions"><button type="button" class="ghost" id="plClose">Закрыть</button></div>
  </form>
</dialog>
<script src="app.js"></script>
